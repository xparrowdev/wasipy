name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android platform 36 + build tools
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.14.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow (for icons)
        run: pip install pillow

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate Android icons + splash screens
        working-directory: mobile
        run: python3 scripts/make-android-icons.py

      - name: Sync Capacitor Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: gradle assembleDebug

      - name: Rename APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk Wasipy-1.0.0.apk

      - name: Publish APK to android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Wasipy Android (latest)
          files: Wasipy-1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
