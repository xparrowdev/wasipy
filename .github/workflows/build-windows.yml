name: Build Wasipy for Windows (x64)

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      - name: Generate app icons
        run: |
          python -m pip install pillow
          python build/make-icon.py

      - name: Read version
        id: version
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + require('./package.json').version + '\n')"

      - run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Wasipy-Windows-x64
          path: desktop/dist/*.exe
          if-no-files-found: error

      - name: Publish versioned release (for auto-update)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.version.outputs.version }}
          name: Wasipy Desktop ${{ steps.version.outputs.version }} for Windows (x64)
          body: |
            Wasipy desktop app for Windows 10/11 (64-bit).

            Download Wasipy-Setup-*-x64.exe below, run it, and sign in with Google.
            The app stays in the system tray and notifies you about due reminders.
            From 1.0.4, the app updates itself automatically.
          files: |
            desktop/dist/*.exe
            desktop/dist/latest.yml

      - name: Update rolling latest release (website download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Wasipy Desktop for Windows (x64)
          body: |
            Wasipy desktop app for Windows 10/11 (64-bit).

            Download Wasipy-Setup-*-x64.exe below, run it, and sign in with Google.
            The app stays in the system tray and notifies you about due reminders.
          files: desktop/dist/*.exe
