<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wasipy — Offline</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101013;color:#f0f0f2;font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;text-align:center;padding:24px}
  .card{max-width:420px}
  .orb{width:56px;height:56px;margin:0 auto 20px;border-radius:16px;background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#2563eb);display:grid;place-items:center;font-size:30px;font-weight:800;color:#fff}
  h1{font-size:22px;margin:0 0 8px}
  p{color:#a8a8b0;font-size:15px;line-height:1.6;margin:0 0 20px}
  a{display:inline-block;background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#2563eb);color:#fff;text-decoration:none;font-weight:600;font-size:15px;padding:11px 26px;border-radius:999px}
  a:hover{opacity:.9}
</style>
</head>
<body>
<div class="card">
  <div class="orb">W</div>
  <h1>You&rsquo;re offline</h1>
  <p>Wasipy needs an internet connection to reach your Google account. Check your connection, then try again.</p>
  <a href="https://wasipy.vercel.app/">Try again</a>
</div>
</body>
</html>
