<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wasipy — Offline</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101013;color:#f0f0f2;font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;text-align:center;padding:24px}
  .card{max-width:420px}
  .orb{width:56px;height:56px;margin:0 auto 20px}
  .orb svg{width:100%;height:100%;display:block}
  h1{font-size:22px;margin:0 0 8px}
  p{color:#a8a8b0;font-size:15px;line-height:1.6;margin:0 0 20px}
  a{display:inline-block;background:#0b1b3a;color:#fff;text-decoration:none;font-weight:600;font-size:15px;padding:11px 26px;border-radius:999px}
  a:hover{opacity:.9}
</style>
</head>
<body>
<div class="card">
  <div class="orb"><svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#0b1b3a"/><path d="M22 30 L36 66 L50 43 L64 66 L78 35" fill="none" stroke="#fff" stroke-width="11.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="80" cy="30" r="7.5" fill="#ffb020"/></svg></div>
  <h1>You&rsquo;re offline</h1>
  <p>Wasipy needs an internet connection to reach your Google account. Check your connection, then try again.</p>
  <a href="https://wasipy.vercel.app/">Try again</a>
</div>
</body>
</html>
